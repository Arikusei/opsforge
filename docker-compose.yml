services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      APP_ENV: demo
      DATABASE_URL: sqlite:////app/data/opsforge.db
      KNOWLEDGE_DIR: /app/knowledge
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-opsforge-webhook-dev}
      N8N_HOST: n8n
      N8N_PORT: "5678"
    volumes:
      - api-data:/app/data
    expose:
      - "8000"
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:1.72.1
    environment:
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:-opsforge}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD:-opsforge-n8n}
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      GENERIC_TIMEZONE: Europe/Moscow
    volumes:
      - n8n-data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    expose:
      - "5678"
    depends_on:
      - api
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-opsforge}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-opsforge-secret}
    volumes:
      - minio-data:/data
    expose:
      - "9000"
      - "9001"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
      - n8n
      - minio
    restart: unless-stopped

volumes:
  api-data:
  n8n-data:
  minio-data:
