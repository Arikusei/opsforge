worker_processes 1;

events { worker_connections 1024; }

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  server_tokens off;

  upstream api { server api:8000; }
  upstream n8n { server n8n:5678; }
  upstream minio { server minio:9000; }
  upstream minio_console { server minio:9001; }

  server {
    listen 80;
    server_name localhost;

    location /health {
      proxy_pass http://api/health;
    }

    location /metrics {
      proxy_pass http://api/metrics;
    }

    location /n8n/ {
      proxy_pass http://n8n/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
    }

    location /s3/ {
      proxy_pass http://minio/;
    }

    location /minio-console/ {
      proxy_pass http://minio_console/;
    }

    location / {
      proxy_pass http://api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }

  # TLS-контур: положите fullchain.pem и privkey.pem в nginx/ssl/
  # и раскомментируйте блок. Скрипт: scripts/make-ssl.sh
  # server {
  #   listen 443 ssl;
  #   ssl_certificate     /etc/nginx/ssl/fullchain.pem;
  #   ssl_certificate_key /etc/nginx/ssl/privkey.pem;
  #   ssl_protocols       TLSv1.2 TLSv1.3;
  #   location / { proxy_pass http://api; }
  # }
}
